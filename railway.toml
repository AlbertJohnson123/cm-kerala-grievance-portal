[build]
builder = "NIXPACKS"
buildCommand = "pnpm install && pnpm exec prisma generate && pnpm exec prisma db push && pnpm exec prisma db seed && pnpm run build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
